<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Global Water Atlas: a globe filling with water, on the app's gauge-blue tile. -->
  <defs>
    <linearGradient id="gwa-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b7f9f"/>
      <stop offset="1" stop-color="#0a4255"/>
    </linearGradient>
    <linearGradient id="gwa-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ae6fa"/>
      <stop offset="1" stop-color="#2fa9d2"/>
    </linearGradient>
    <clipPath id="gwa-globe">
      <circle cx="32" cy="32" r="20.5"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#gwa-tile)"/>
  <g clip-path="url(#gwa-globe)">
    <ellipse cx="32" cy="32" rx="8.5" ry="20.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-opacity=".6"/>
    <path fill="none" stroke="#fff" stroke-width="2.6" stroke-opacity=".6" d="M8 23.5h48"/>
    <path fill="url(#gwa-water)" d="M-2 34.5q5.5-6.5 11 0t11 0t11 0t11 0t11 0t11 0V66H-2z"/>
  </g>
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="#fff" stroke-width="4.6"/>
</svg>
