<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Water Atlas</title>
    <meta
      name="description"
      content="Browse and download observed river, rainfall, reservoir and coastal water data from around the world, via the RivRetrieve library."
    />
    <meta name="author" content="Nguyen Xuan Tinh, Nippon Koei Co., Ltd." />

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#14657f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1417" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Global Water Atlas" />
    <meta property="og:title" content="Global Water Atlas" />
    <meta
      property="og:description"
      content="Find, preview and download observed river discharge, water level, rainfall and sea level data from public networks worldwide."
    />
    <meta property="og:url" content="https://global-water-atlas.vercel.app/" />
    <meta property="og:image" content="https://global-water-atlas.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Linked here rather than imported from the stylesheet, so the fonts load in parallel with it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
